[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "barkfilter-phase0a"
version = "0.1.0"
description = "Offline, source-selective dog bark removal feasibility prototype"
requires-python = ">=3.11"
dependencies = ["numpy>=1.24,<3", "scipy>=1.11", "soundfile>=0.12", "psutil>=5.9"]

[project.optional-dependencies]
detector = ["tensorflow>=2.15", "tensorflow-hub>=0.16"]
onnx-detector = ["onnxruntime>=1.18"]
test = ["pytest>=8"]

[project.scripts]
barkfilter = "barkfilter.cli:main"
barkfilter-bench = "barkfilter.benchmark:main"
barkfilter-demos = "barkfilter.demos:main"

[tool.setuptools.packages.find]
include = ["barkfilter*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
